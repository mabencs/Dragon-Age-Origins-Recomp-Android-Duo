# Phase 4.1.

# The native build is the expensive part and Gradle's own daemon does not need much,
# but AGP's resource and dexing work does. 4 GB is comfortable on a 16 GB workstation
# and well clear of the 512 MB default that makes AGP 9 fail on large projects.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

# AndroidX, not the obsolete support library.
android.useAndroidX=true

# Fail rather than silently download an SDK platform: the versions this project
# builds against are pinned in docs/TOOLCHAIN.md and installed deliberately, and an
# automatic download is how a build quietly stops matching its documentation.
android.builder.sdkDownload=false

# PLAN 11.3: the app's version (major.minor.patch, an optional -label; the version code
# follows from the numbers - see app/build.gradle.kts), the release's name, and where its
# source is published (About this app shows them; the GPL-3.0 asks that whoever gets the
# app can get the source).
warden.version=0.1.0-alpha
warden.releaseName=Open Alpha
warden.sourceUrl=
